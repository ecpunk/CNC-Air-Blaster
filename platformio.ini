[env:esp32-wroom-32]
platform = espressif32
board = esp32-pico-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=0

; Library dependencies
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit NeoPixel@^1.11.3

; Source code locations
src_dir = .
include_dir = .

; Monitor options
monitor_filters =
    time
    log2file

; Upload method (USB)
upload_port = COM3
; Uncomment and change to your serial port if needed:
; Windows: COM3, COM4, etc.
; Linux: /dev/ttyUSB0, /dev/ttyACM0, etc.
; macOS: /dev/cu.SLAB_USBtoUART, /dev/cu.usbserial-*, etc.
